<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>North Star Bakery - Joke Generator</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .joke-container {
            background: linear-gradient(135deg, #d4a574 0%, #8b6f47 100%);
            color: #fff;
            padding: 3rem 2rem;
            border-radius: 10px;
            text-align: center;
            margin: 2rem 0;
            min-height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .joke-text {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            line-height: 1.8;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loading {
            font-size: 1.2rem;
            color: #fff;
        }

        .btn-joke {
            background-color: #fff;
            color: #8b6f47;
            padding: 0.8rem 2rem;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s ease;
        }

        .btn-joke:hover {
            transform: scale(1.05);
            background-color: #f0f0f0;
        }

        .joke-category {
            font-size: 0.9rem;
            margin-top: 1rem;
            opacity: 0.9;
        }

        .error-message {
            color: #ffcccc;
            font-size: 1rem;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">NORTH STAR BAKERY</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Pre-Orders</a>
            <a href="jokes.html" class="active">Jokes</a>
        </nav>
    </header>

    <main class="page-content">
        <h1>🎂 Bakery Joke Generator 🎂</h1>
        <p class="subtitle">Get a random joke while you wait for your order!</p>

        <div class="joke-container">
            <div class="joke-text" id="jokeText">
                <span class="loading">Click the button to get a random joke!</span>
            </div>
            <button class="btn-joke" onclick="getJoke()">Get a Joke</button>
            <div class="joke-category" id="jokeCategory"></div>
            <div class="error-message" id="errorMessage"></div>
        </div>
    </main>

    <footer>
        <p>© 2026 North Star Bakery. Designed by Rolando Guardado Lopez.</p>
    </footer>

    <script>
        async function getJoke() {
            const jokeText = document.getElementById('jokeText');
            const errorMessage = document.getElementById('errorMessage');
            const jokeCategory = document.getElementById('jokeCategory');

            // Clear previous content
            jokeText.innerHTML = '<span class="loading">Loading joke...</span>';
            errorMessage.innerHTML = '';
            jokeCategory.innerHTML = '';

            try {
                // Using JokeAPI - free API that doesn't require authentication
                const response = await fetch('https://v2.jokeapi.dev/joke/Any?format=json');
                
                if (!response.ok) {
                    throw new Error('Failed to fetch joke');
                }

                const data = await response.json();

                // Handle different joke formats
                if (data.type === 'single') {
                    jokeText.textContent = data.joke;
                } else if (data.type === 'twopart') {
                    jokeText.innerHTML = `
                        <div>
                            <p><strong>Setup:</strong> ${data.setup}</p>
                            <p><strong>Punchline:</strong> ${data.delivery}</p>
                        </div>
                    `;
                }

                jokeCategory.textContent = `Category: ${data.category}`;

            } catch (error) {
                jokeText.innerHTML = '<span class="loading">Sorry, couldn\'t load a joke right now!</span>';
                errorMessage.textContent = 'Error: ' + error.message;
                console.error('Error fetching joke:', error);
            }
        }

        // Auto-load a joke when page loads
        window.addEventListener('load', () => {
            getJoke();
        });
    </script>
</body>
</html>
